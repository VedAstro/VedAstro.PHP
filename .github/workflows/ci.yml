name: PHP SDK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Lint every PHP file
        run: php tests/lint.php

      # The suite needs no API key: it drives the client through a fake transport, and one
      # integration test talks to a local PHP server the suite starts itself.
      - name: Run the test suite
        run: php tests/run.php
